name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Enable npm trusted publishing
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p "require('./projects/uae-pass/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"

      - name: Verify signed release tag
        run: git verify-tag "${GITHUB_REF_NAME}"

      - name: Run release quality gates
        run: npm run validate

      - name: Create package tarball
        run: npm pack ./dist/uae-pass

      - name: Generate CycloneDX SBOM
        shell: bash
        run: npm sbom --sbom-format cyclonedx > sensei-uaepass-sbom.cdx.json

      - name: Publish with provenance
        run: npm publish ./dist/uae-pass --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          sensei-uaepass-*.tgz
          sensei-uaepass-sbom.cdx.json
          --verify-tag
          --generate-notes
          --title "Sensei UAE PASS ${{ github.ref_name }}"
