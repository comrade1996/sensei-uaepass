name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Validate and publish
    runs-on: ubuntu-latest
    environment: npm

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Enable npm trusted publishing
        run: npm install --global npm@11.16.0

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          package_version=$(node -p "require('./projects/uae-pass/package.json').version")
          tag_version="${GITHUB_REF_NAME#v}"
          test "$package_version" = "$tag_version"

      - name: Verify signed release tag
        shell: bash
        run: |
          git fetch --tags --force origin
          if [ "$(git cat-file -t "${GITHUB_REF_NAME}" 2>/dev/null || true)" = "tag" ]; then
            git verify-tag "${GITHUB_REF_NAME}"
          else
            echo "Tag '${GITHUB_REF_NAME}' is lightweight. git verify-tag requires an annotated, signed tag."
            echo "Create one with: git tag -s ${GITHUB_REF_NAME} -m 'Release ${GITHUB_REF_NAME}' && git push origin ${GITHUB_REF_NAME} --force"
            exit 1
          fi

      - name: Run release quality gates
        run: npm run validate

      - name: Create package tarball
        run: npm pack ./dist/uae-pass

      - name: Generate CycloneDX SBOM
        shell: bash
        run: npm sbom --sbom-format cyclonedx > sensei-uaepass-sbom.cdx.json

      - name: Publish with provenance
        run: npm publish ./dist/uae-pass --access public --provenance

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          sensei-uaepass-*.tgz
          sensei-uaepass-sbom.cdx.json
          --verify-tag
          --generate-notes
          --title "Sensei UAE PASS ${{ github.ref_name }}"
